name: utang_tracker
description: "Utang tracker for sari-sari stores in the Philippines."
publish_to: 'none'

version: 1.0.50+49

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.0
  flutter_riverpod: ^3.3.2
  path_provider: ^2.1.5
  drift_flutter: ^0.3.0
  pub_semver: ^2.2.0
  go_router: ^17.3.0
  equatable: ^2.1.0
  sqlite3: ^3.5.0
  drift: ^2.34.1
  intl: ^0.20.2
  uuid: ^4.5.3
  http: ^1.4.0
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/new-logo.png
  adaptive_icon_background: "#0C2648"
  adaptive_icon_foreground: assets/images/new-logo.png

flutter_native_splash:
  color: "#0C2648"
  image: assets/images/new-logo-splash.png
  android: true
  ios: false
  android_12:
    color: "#0C2648"
    image: assets/images/new-logo-splash.png

flutter:

  uses-material-design: true

  assets:
    - assets/images/new-logo.png
    - assets/release_notes/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700


